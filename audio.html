<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>RIDE OR DIE - audio lab</title>
<style>
  :root { --bg:#14110f; --panel:#1e1a17; --line:#3a322b; --fg:#e9dfd3; --dim:#9a8f83; --acc:#e8792b; --ok:#7bd88f; --bad:#ff6b5e; --warn:#ffc21a; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.35 system-ui, Segoe UI, sans-serif; }
  body { padding:10px 14px 40px; }
  h1 { font-size:16px; margin:0 0 8px; letter-spacing:.08em; color:var(--acc); }
  h2 { font-size:12px; margin:0 0 6px; text-transform:uppercase; letter-spacing:.12em; color:var(--warn); border-bottom:1px solid var(--line); padding-bottom:3px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); gap:10px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:8px 10px; }
  .wide { grid-column:1 / -1; }
  button { background:#2b241f; color:var(--fg); border:1px solid #5a4a3c; border-radius:3px; padding:3px 8px; margin:2px 3px 2px 0; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button:active { background:var(--acc); color:#000; }
  button.on { background:var(--acc); color:#000; }
  button.big { padding:8px 16px; font-size:15px; }
  label.row { display:flex; align-items:center; gap:8px; margin:2px 0; }
  label.row > span:first-child { width:92px; color:var(--dim); flex:none; }
  label.row input[type=range] { flex:1; min-width:80px; accent-color:var(--acc); }
  label.row .val { width:52px; text-align:right; font-variant-numeric:tabular-nums; }
  select, input[type=text] { background:#2b241f; color:var(--fg); border:1px solid #5a4a3c; border-radius:3px; padding:2px 4px; font:inherit; }
  .mono { font:11px/1.35 ui-monospace, Consolas, monospace; white-space:pre; overflow:auto; color:#cfc6ba; }
  .miss { display:flex; flex-wrap:wrap; gap:4px; }
  .tag { padding:1px 6px; border-radius:9px; border:1px solid #5a4a3c; font:11px ui-monospace, Consolas, monospace; }
  .tag.bad { border-color:var(--bad); color:var(--bad); }
  .tag.ok { border-color:#2f5a3a; color:var(--ok); }
  canvas { background:#0d0b0a; border:1px solid var(--line); border-radius:3px; }
  .card { border:1px solid var(--line); border-radius:4px; padding:6px 8px; margin:4px 0; background:#191512; }
  .card b { color:var(--acc); }
  #status { color:var(--dim); margin-left:10px; }
  .pass { color:var(--ok); } .fail { color:var(--bad); }
</style>
</head>
<body>
<h1>RIDE OR DIE / AUDIO LAB <span id="status">not started</span></h1>
<div id="app"></div>
<script type="module" src="/src/dev_audio.js"></script>
</body>
</html>
