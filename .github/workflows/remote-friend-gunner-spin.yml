name: Remote bounded friend gunner hip aim investigation
on:
  # Narrow initial registration on the existing feature branch. Root owns the
  # push and sequential remote validation lease; no recurring execution.
  push:
    branches: [codex/rideordie-fast-opt]
    paths:
      - .github/workflows/remote-friend-gunner-spin.yml
      - tools/test/friend_gunner_spin_remote.mjs
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full committed source SHA containing the explicitly integrated collector
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: remote-friend-gunner-spin
  cancel-in-progress: false
jobs:
  friend-spin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FRIEND_SPIN_REMOTE: '1'
      VITE_TURN_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind exact requested source
        env:
          SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "EXPECTED_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Remote muted bounded real-menu co-op hip collector
        timeout-minutes: 10
        # Collector bounds normal work to eight minutes, cleanup to25seconds.
        # GNU timeout is the final root-owned worker process-group hard cap.
        run: timeout --signal=TERM --kill-after=15s 9m node --max-old-space-size=2048 tools/test/friend_gunner_spin_remote.mjs --remote-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: friend-gunner-spin-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/
            shots/friend-gunner-spin/
          if-no-files-found: error
          retention-days: 14
