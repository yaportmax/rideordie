<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIDE OR DIE audio audition</title>
<style>
:root{--bg:#14161a;--fg:#e8e6df;--mut:#8b8f98;--acc:#ffb14a;--card:#1d2026;--line:#2b2f37}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;background:#0f1114;padding:10px 16px;border-bottom:1px solid var(--line);z-index:5;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
h1{font-size:16px;margin:0;color:var(--acc)}h2{font-size:14px;margin:18px 0 6px;color:var(--acc);text-transform:uppercase;letter-spacing:.08em}
main{padding:0 16px 60px;max-width:1300px;margin:auto}
input[type=search]{background:var(--card);border:1px solid var(--line);color:var(--fg);padding:6px 10px;border-radius:6px;width:220px}
button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:3px 9px;cursor:pointer;font:inherit}
button:hover{border-color:var(--acc)}button.on{background:var(--acc);color:#111}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.s{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.s b{font-weight:600}.s small{color:var(--mut);display:block;margin:2px 0 6px}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0}
label{color:var(--mut);margin-right:6px}input[type=range]{width:260px;vertical-align:middle}.val{display:inline-block;min-width:70px;text-align:right}
select{background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:4px;border-radius:5px}
</style></head><body>
<header><h1>RIDE OR DIE - audio audition</h1>
<input id="q" type="search" placeholder="filter (e.g. gun, engine, loop)">
<label><input type="checkbox" id="usegain" checked> apply manifest gain</label>
<label>master <input type="range" id="master" min="0" max="1" step="0.01" value="0.7"></label>
<button id="stop">stop all</button></header>
<main>
<h2>Engine simulator</h2>
<div class="panel" id="engpanel">
  <div class="row"><label>engine</label><select id="eng"></select>
  <button id="engplay">start</button>
  <label style="margin-left:14px">RPM</label><input type="range" id="rpm" min="500" max="7500" value="900"><span class="val" id="rpmv"></span>
  <label>sweep</label><button id="rev">auto-rev</button></div>
  <div class="row" style="margin-top:6px"><label>speed km/h</label><input type="range" id="spd" min="0" max="220" value="0"><span class="val" id="spdv"></span>
  <label>tyres</label><select id="surf"><option value="tyre_asphalt_loop">asphalt</option><option value="tyre_dirt_loop">dirt</option></select>
  <label>skid</label><input type="range" id="skid" min="0" max="1" step="0.01" value="0"></div>
  <div style="color:var(--mut);margin-top:6px">Two neighbouring stage loops are crossfaded equal-power; playbackRate = rpm / stageRpm. Wind + tyre roar scale with speed. Whine layers appear for t4 / boss.</div>
</div>
<div id="musicwrap"></div>
<div id="lib"></div>
</main>
<script>
const BASE = new URLSearchParams(location.search).get('base') || '/audio/';
let man, ctx, master;
const buffers = new Map(), playing = new Set();
const el = id => document.getElementById(id);
async function init() {
  man = await (await fetch(BASE + 'manifest.json')).json();
  ctx = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 44100});
  master = ctx.createGain(); master.gain.value = +el('master').value; master.connect(ctx.destination);
  el('master').oninput = e => master.gain.value = +e.target.value;
  el('stop').onclick = stopAll;
  el('q').oninput = renderLib;
  const sel = el('eng'); Object.keys(man.engines).forEach(n => sel.add(new Option(n + ' - ' + man.engines[n].description, n)));
  renderLib(); renderMusic(); initEngine();
}
async function buf(file) {
  if (!buffers.has(file)) buffers.set(file, ctx.decodeAudioData(await (await fetch(BASE + file.replace(/^\//, ''))).arrayBuffer()));
  return buffers.get(file);
}
function gainFor(d) { return el('usegain').checked ? d.gain : 1; }
async function play(key, idx, loop) {
  await ctx.resume();
  const d = man.sounds[key], f = d.files[idx % d.files.length];
  const b = await buf(f), s = ctx.createBufferSource(), g = ctx.createGain();
  s.buffer = b; s.loop = !!loop; g.gain.value = gainFor(d); s.connect(g); g.connect(master); s.start();
  const h = {s, g, key}; playing.add(h); s.onended = () => playing.delete(h); return h;
}
function stopAll() { for (const h of playing) { try { h.s.stop(); } catch (e) {} } playing.clear(); engineStop(); musicStop(); }
function renderLib() {
  const q = el('q').value.toLowerCase(), groups = {};
  for (const [k, d] of Object.entries(man.sounds)) {
    if (d.engine) continue;
    if (q && !(k + ' ' + d.category + ' ' + (d.loop ? 'loop' : '')).toLowerCase().includes(q)) continue;
    (groups[k.split('/')[0]] ||= []).push([k, d]);
  }
  el('lib').innerHTML = '';
  for (const [g, items] of Object.entries(groups)) {
    const h = document.createElement('h2'); h.textContent = g + ' (' + items.length + ')'; el('lib').append(h);
    const grid = document.createElement('div'); grid.className = 'grid';
    for (const [k, d] of items) {
      const c = document.createElement('div'); c.className = 's';
      c.innerHTML = `<b>${k.split('/')[1]}</b><small>${d.duration.toFixed(2)} s${d.loop ? ' LOOP' : ''} - gain ${d.gain} - ${d.category}<br>${d.notes || ''}</small>`;
      const row = document.createElement('div'); row.className = 'row';
      d.files.forEach((f, i) => {
        const b = document.createElement('button'); b.textContent = d.files.length > 1 ? String(i + 1) : (d.loop ? 'play loop' : 'play');
        let h = null;
        b.onclick = async () => { if (d.loop) { if (h) { h.s.stop(); h = null; b.classList.remove('on'); } else { h = await play(k, i, true); b.classList.add('on'); } } else play(k, i, false); };
        row.append(b);
      });
      c.append(row); grid.append(c);
    }
    el('lib').append(grid);
  }
}
// ---------------------------------------------------------------- engine simulator
let E = null, revTimer = null;
function initEngine() {
  el('engplay').onclick = () => E ? engineStop() : engineStart();
  el('rpm').oninput = updateEngine; el('spd').oninput = updateEngine; el('skid').oninput = updateEngine;
  el('rev').onclick = () => { if (revTimer) { clearInterval(revTimer); revTimer = null; el('rev').classList.remove('on'); return; }
    el('rev').classList.add('on'); let t = 0; revTimer = setInterval(() => { t += 0.03; const lo = +el('rpm').min + 200, hi = +el('rpm').max - 900;
      el('rpm').value = lo + (hi - lo) * (0.5 - 0.5 * Math.cos(t)); updateEngine(); }, 30); };
}
async function loopSrc(key, idx = 0) {
  const d = man.sounds[key], b = await buf(d.files[idx]), s = ctx.createBufferSource(), g = ctx.createGain();
  s.buffer = b; s.loop = true; g.gain.value = 0; s.connect(g); g.connect(master); s.start(); return {s, g, d};
}
async function engineStart() {
  await ctx.resume();
  const name = el('eng').value, st = man.engines[name].stages;
  E = {name, st, srcs: await Promise.all(st.map(s => loopSrc('vehicles/' + name + '_' + s.stage))),
       wind: await loopSrc('vehicles/wind_loop'), tyre: {}, skid: await loopSrc('vehicles/skid_loop')};
  E.tyre.tyre_asphalt_loop = await loopSrc('vehicles/tyre_asphalt_loop'); E.tyre.tyre_dirt_loop = await loopSrc('vehicles/tyre_dirt_loop');
  const wk = name.includes('t4') ? 'vehicles/supercharger_whine_loop' : (name.includes('boss') ? 'vehicles/turbo_whine_loop' : null);
  E.whine = wk ? await loopSrc(wk) : null;
  el('rpm').min = st[0].rpm * 0.8; el('rpm').max = st[st.length - 1].rpm * 1.1; el('rpm').value = st[0].rpm;
  el('engplay').textContent = 'stop'; el('engplay').classList.add('on'); updateEngine();
}
function engineStop() { if (!E) return; const all = [...E.srcs, E.wind, E.skid, ...Object.values(E.tyre), E.whine].filter(Boolean); all.forEach(x => { try { x.s.stop(); } catch (e) {} }); E = null;
  el('engplay').textContent = 'start'; el('engplay').classList.remove('on'); if (revTimer) { clearInterval(revTimer); revTimer = null; el('rev').classList.remove('on'); } }
function updateEngine() {
  const rpm = +el('rpm').value, spd = +el('spd').value; el('rpmv').textContent = Math.round(rpm) + ' rpm'; el('spdv').textContent = spd + ' km/h';
  if (!E) return;
  const st = E.st; let i = st.findIndex(s => s.rpm > rpm); i = i < 0 ? st.length - 1 : Math.max(0, i - 1);
  const j = Math.min(i + 1, st.length - 1), a = st[i], b = st[j];
  const t = a === b ? 0 : Math.min(1, Math.max(0, (rpm - a.rpm) / (b.rpm - a.rpm)));
  const now = ctx.currentTime;
  E.srcs.forEach((x, k) => { let g = 0; if (k === i) g = Math.cos(t * Math.PI / 2); if (k === j && j !== i) g = Math.sin(t * Math.PI / 2); if (i === j) g = 1;
    x.g.gain.setTargetAtTime(g * x.d.gain * (el('usegain').checked ? 1 : 1), now, 0.03); x.s.playbackRate.setTargetAtTime(rpm / st[k].rpm, now, 0.03); });
  const v = spd / 220;
  E.wind.g.gain.setTargetAtTime(Math.pow(v, 1.6) * 0.9 * E.wind.d.gain * 2.5, now, 0.05); E.wind.s.playbackRate.setTargetAtTime(0.7 + 0.9 * v, now, 0.05);
  for (const [k, x] of Object.entries(E.tyre)) { const on = k === el('surf').value; x.g.gain.setTargetAtTime(on ? Math.min(1, v * 1.2) * x.d.gain * 2.5 : 0, now, 0.05); x.s.playbackRate.setTargetAtTime(0.7 + 0.9 * v, now, 0.05); }
  E.skid.g.gain.setTargetAtTime(+el('skid').value * E.skid.d.gain * 2, now, 0.03); E.skid.s.playbackRate.setTargetAtTime(0.85 + 0.4 * v, now, 0.05);
  if (E.whine) { const u = (rpm - st[0].rpm) / (st[st.length - 1].rpm - st[0].rpm); E.whine.g.gain.setTargetAtTime(Math.max(0, u) * E.whine.d.gain * 3, now, 0.05); E.whine.s.playbackRate.setTargetAtTime(0.5 + 1.1 * Math.max(0, u), now, 0.05); }
}
// ---------------------------------------------------------------- music stems
let M = null;
function renderMusic() {
  const tracks = {};
  for (const [k, d] of Object.entries(man.sounds)) if (k.startsWith('music/') && d.stem) (tracks[d.track] ||= []).push([k, d]);
  const w = el('musicwrap'); w.innerHTML = '';
  if (!Object.keys(tracks).length) return;
  w.innerHTML = '<h2>Music stems</h2>';
  const p = document.createElement('div'); p.className = 'panel';
  p.innerHTML = '<div class="row"><label>track</label><select id="mtrack"></select><button id="mplay">play</button><label style="margin-left:14px">intensity</label>' +
    '<input type="range" id="mint" min="0" max="3" step="0.01" value="3"><span class="val" id="mintv"></span></div><div id="minfo" style="color:var(--mut);margin-top:6px"></div>';
  w.append(p);
  const sel = p.querySelector('#mtrack'); Object.keys(tracks).forEach(t => sel.add(new Option(t, t)));
  const info = () => { const d = tracks[sel.value][0][1]; p.querySelector('#minfo').textContent = `${d.bpm || '?'} BPM, ${d.bars || '?'} bars, ${d.key || ''}, loop ${d.duration.toFixed(2)} s, stems: ` + tracks[sel.value].map(x => x[1].stem).join(', '); };
  sel.onchange = info; info();
  p.querySelector('#mplay').onclick = async e => { if (M) { musicStop(); return; } await ctx.resume();
    const items = tracks[sel.value]; const t0 = ctx.currentTime + 0.15; M = {srcs: []};
    for (const [k, d] of items) { const b = await buf(d.file), s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = b; s.loop = true; s.connect(g); g.connect(master); M.srcs.push({s, g, d}); }
    M.srcs.forEach(x => x.s.start(t0)); e.target.textContent = 'stop'; e.target.classList.add('on'); mixMusic(); };
  p.querySelector('#mint').oninput = mixMusic; mixMusic();
}
function mixMusic() { const v = +el('mint').value; el('mintv').textContent = v.toFixed(2); if (!M) return;
  M.srcs.forEach(x => { const lay = x.d.intensity ?? ['base', 'drums', 'lead', 'extra'].indexOf(x.d.stem); const g = Math.min(1, Math.max(0, v - lay + 1)) ; x.g.gain.setTargetAtTime(g * (el('usegain').checked ? x.d.gain : 1), ctx.currentTime, 0.25); }); }
function musicStop() { if (!M) return; M.srcs.forEach(x => { try { x.s.stop(); } catch (e) {} }); M = null; const b = document.getElementById('mplay'); if (b) { b.textContent = 'play'; b.classList.remove('on'); } }
init();
</script></body></html>
